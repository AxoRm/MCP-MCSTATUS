services:
  mcstatus-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcstatus-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_STREAMABLE_HTTP_PATH: /mcp
      MCP_SSE_PATH: /sse
      MCSTATUS_API_BASE_URL: https://mcstatus.xyz/api
      MCSTATUS_TIMEOUT_MS: "4000"
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      MAXMIND_DB_PATH: /app/data/GeoLite2-City.mmdb
      MAXMIND_EDITION_ID: GeoLite2-City
      MAXMIND_REFRESH_HOURS: "24"
